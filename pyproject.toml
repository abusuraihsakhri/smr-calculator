[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smr-calculator"
version = "3.0.0"
description = "Standardized Mortality Ratio Calculator — Clinical Decision Support & Biomedical Computing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri", email = "abusuraihsakhri@github.com"},
]
keywords = ["clinical", "biomedical", "smr", "meld-na", "fib-4", "apri", "qtc", "hba1c"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
smr = "smr:main"
smr-cli = "cli:main"

[tool.setuptools]
packages = ["agents"]
py-modules = ["smr", "smr_core", "cli", "enrichment", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_smr.py"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
