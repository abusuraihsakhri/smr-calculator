name: Python and browser calculator tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies and package
        run: python -m pip install -e ".[test]"
      - name: Check environment and syntax
        run: |
          python -m pip check
          python -m compileall -q smr.py smr_core.py agents tests
          node --check web/smr.js
          node --check web/app.js
      - name: Run Python and browser regression tests
        run: |
          python -m pytest -q
          node --test tests/test_smr_js.cjs
      - name: CLI SMR smoke test
        run: python -m smr smr --observed 10 --expected 8
